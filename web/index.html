<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="CineBook — đặt vé xem phim trực tuyến, chọn ghế theo thời gian thực." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bitter:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>CineBook — Đặt vé xem phim</title>
  </head>
  <body>
    <script>
      // Đặt chủ đề ngay lúc tải, trước khi React dựng cây — nếu để React làm
      // thì trang sẽ chớp một nhịp màu sai rồi mới đổi.
      try {
        var t = localStorage.getItem('cinebook.theme');
        document.documentElement.dataset.theme = (t === 'dark' || t === 'light') ? t : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
